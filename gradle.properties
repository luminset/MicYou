#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6144M -XX:+UseG1GC -XX:MaxGCPauseMillis=200

#Gradle
org.gradle.jvmargs=-Xmx6144M -Xms2048M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=gradle-heap-dump.hprof -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.workers.max=4

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# JDK 配置（AGP 9.x 需要 JDK 17+，兼容模式也需要 JDK 11+）
# 当前系统 JAVA_HOME 已指向 JDK 17，Gradle 会自动使用，无需取消注释
# 如需指定其他 JDK 路径，取消下面一行的注释并修改：
# org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-17.0.20.101-hotspot
#
# 注意：不要通过系统环境变量 JAVA_HOME 修改，以免影响其他依赖 Java 8 的程序

# Project Versioning
project.version=2.0.1
project.version.code=25
project.name=MicYou
