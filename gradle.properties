#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6144M -XX:+UseG1GC -XX:MaxGCPauseMillis=200

#Gradle
org.gradle.jvmargs=-Xmx6144M -Xms2048M -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=gradle-heap-dump.hprof -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.workers.max=4


#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Project Versioning
project.version=1.1.5
project.version.code=12
project.name=MicYou

# Plugin API Version
pluginApiVersion=1.0.0

# Disable strict dependency checks
android.dependencyResolution.strictMode=false
